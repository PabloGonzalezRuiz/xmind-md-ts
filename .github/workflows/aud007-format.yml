name: AUD-007 formatting diagnostic

on:
  push:
    branches:
      - feature/aud-003-runtime-schema

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/aud-003-runtime-schema
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write src/adapters/xmind/xmind-adapter.ts src/cli/main.ts
      - name: Commit formatting on the feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/adapters/xmind/xmind-adapter.ts src/cli/main.ts
          if ! git diff --cached --quiet; then
            git commit -m "AUD-007: aplicar formato Prettier al adaptador y CLI"
            git push origin HEAD:feature/aud-003-runtime-schema
          fi
