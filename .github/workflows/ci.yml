name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, test and build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Temporary AUD-008 formatter
        run: npx prettier --write src/adapters/svg/svg-adapter.ts src/cli/main.ts test/svg-adapter.test.ts test/cli.test.ts

      - name: Emit formatted source for controlled commit
        shell: bash
        run: |
          echo "BEGIN_SVG_ADAPTER"
          base64 -w0 src/adapters/svg/svg-adapter.ts
          echo
          echo "END_SVG_ADAPTER"
          echo "BEGIN_CLI"
          base64 -w0 src/cli/main.ts
          echo
          echo "END_CLI"
          echo "BEGIN_SVG_TEST"
          base64 -w0 test/svg-adapter.test.ts
          echo
          echo "END_SVG_TEST"
          echo "BEGIN_CLI_TEST"
          base64 -w0 test/cli.test.ts
          echo
          echo "END_CLI_TEST"

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Check generated IR types
        run: npm run check:generated-types

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: CLI compiled smoke test
        run: node dist/src/cli/main.js --help
