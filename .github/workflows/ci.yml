name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, test and build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Print canonical formatting for package verifier
        run: npx prettier scripts/verify-package.js

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Check generated IR types
        run: npm run check:generated-types

      - name: Check package and CLI version
        run: npm run check:version

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: CLI compiled smoke test
        run: node dist/src/cli/main.js --help

      - name: Verify examples and installable package
        run: npm run verify:examples && npm run verify:package

  dependency-audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate npm audit report
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
          console.log('npm audit summary');
          console.log(JSON.stringify(report.metadata?.vulnerabilities ?? {}, null, 2));
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            console.log([
              name,
              'severity=' + item.severity,
              'direct=' + item.isDirect,
              'range=' + item.range,
              'fixAvailable=' + JSON.stringify(item.fixAvailable),
              'via=' + JSON.stringify(item.via.map(v => typeof v === 'string' ? v : { title: v.title, range: v.range, url: v.url }))
            ].join(' | '));
          }
          NODE

      - name: Upload machine-readable audit report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json
          if-no-files-found: error
          retention-days: 30
