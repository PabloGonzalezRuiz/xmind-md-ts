name: Verify and format AUD-003 (temporary)

on:
  push:
    branches: ['feature/phase-6-style-engine']

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format changed TypeScript files
        run: npx prettier --write src/validation/validate-ir.ts test/ir-schema-validator.test.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/validation/validate-ir.ts test/ir-schema-validator.test.ts
          git commit -m "style: format runtime IR schema validation"
          git push
