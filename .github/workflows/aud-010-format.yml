name: AUD-010 · Temporary formatter

on:
  push:
    branches: ['feature/aud-003-runtime-schema']
    paths:
      - '.github/workflows/aud-010-format.yml'
      - 'scripts/verify-examples.js'
      - 'scripts/verify-package.js'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write scripts/verify-examples.js scripts/verify-package.js
      - name: Commit formatting if needed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/verify-examples.js scripts/verify-package.js
          if git diff --cached --quiet; then
            echo 'Scripts already formatted.'
          else
            git commit -m 'style(AUD-010): apply Prettier formatting'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
